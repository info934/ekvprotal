services:
  ekvportal:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: ekvportal:latest
    container_name: ekvportal
    restart: unless-stopped
    init: true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
