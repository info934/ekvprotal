project_id = "horizons-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://portal.ekvproject.cz"
additional_redirect_urls = ["https://portal.ekvproject.cz", "https://portal.ekvproject.cz/update-password", "http://127.0.0.1:3000", "http://127.0.0.1:3003", "http://127.0.0.1:3005", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.send-scheduled-reports]
verify_jwt = false

[functions.manage-users]
verify_jwt = false

[functions.document-storage]
verify_jwt = true

[functions.planning-calendar]
verify_jwt = true

[functions.analyze-contract]
verify_jwt = true

[functions.google-drive-esign]
verify_jwt = false

[functions.send-message-to-member]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.send-payout-email]
verify_jwt = false

[functions.send-admin-payout-notification]
verify_jwt = false

[functions.send-payout-notification]
verify_jwt = false
